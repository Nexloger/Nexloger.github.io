<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexloger | Initialize Identity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at bottom left, #09090b, #020617); 
            height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .glass {
            background: rgba(24, 24, 27, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        input:focus {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.1);
        }

        .auth-animate { animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-zinc-400 flex items-center justify-center p-6">

    <div class="w-full max-w-md glass p-12 rounded-[2.5rem] space-y-10 shadow-2xl auth-animate">
        
        <div class="space-y-3 text-center">
            <div class="inline-block px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-full text-[9px] text-emerald-500 mono font-bold uppercase tracking-[0.3em] mb-2">
                Phase_01: Identity_Creation
            </div>
            <h2 class="text-white font-black tracking-tighter text-3xl italic uppercase">Initialize_New</h2>
            <p class="text-[10px] text-zinc-500 uppercase tracking-widest leading-loose mono">Registering a new node to the Nexloger network</p>
        </div>

        <div class="space-y-5">
            <div class="group">
                <label class="text-[9px] text-zinc-600 uppercase font-bold ml-2 mono group-focus-within:text-emerald-500 transition-colors">Terminal_Email</label>
                <input id="reg-email" type="email" placeholder="user@terminal.net" class="w-full bg-black/40 border border-white/5 rounded-2xl p-4 text-sm text-zinc-200 outline-none focus:border-emerald-500/40 transition-all mt-1">
            </div>
            
            <div class="group">
                <label class="text-[9px] text-zinc-600 uppercase font-bold ml-2 mono group-focus-within:text-emerald-500 transition-colors">Display_Name</label>
                <input id="reg-name" type="text" placeholder="Ghost_In_Shell" class="w-full bg-black/40 border border-white/5 rounded-2xl p-4 text-sm text-zinc-200 outline-none focus:border-emerald-500/40 transition-all mt-1">
            </div>

            <div class="group">
                <label class="text-[9px] text-zinc-600 uppercase font-bold ml-2 mono group-focus-within:text-emerald-500 transition-colors">Access_Code</label>
                <input id="reg-pass" type="password" placeholder="••••••••" class="w-full bg-black/40 border border-white/5 rounded-2xl p-4 text-sm text-zinc-200 outline-none focus:border-emerald-500/40 transition-all mt-1">
            </div>

            <button id="reg-submit" class="w-full bg-emerald-600 text-white py-5 rounded-2xl text-[11px] font-black hover:bg-emerald-500 transition-all uppercase tracking-[0.2em] mt-6 shadow-lg shadow-emerald-900/40 active:scale-[0.98]">
                Deploy_Identity
            </button>
        </div>

        <div class="text-center pt-4 border-t border-white/5">
            <a href="login.html" class="text-[10px] text-zinc-500 hover:text-white uppercase tracking-widest transition-colors mono">Already assigned? <span class="text-emerald-500 font-bold underline underline-offset-4 decoration-emerald-500/30">Back_to_Login</span></a>
        </div>
        
        <div id="reg-msg" class="text-[9px] text-center text-rose-500 uppercase h-2 font-bold mono"></div>
    </div>

    <script type="module">
        document.getElementById('reg-submit').onclick = async () => {
            const email = document.getElementById('reg-email').value;
            const name = document.getElementById('reg-name').value;
            const pass = document.getElementById('reg-pass').value;
            const msg = document.getElementById('reg-msg');

            if (!email || !name || !pass) {
                msg.innerText = 'DATA_INCOMPLETE';
                return;
            }

            msg.innerText = 'PREPARING_IDENTITY_TOKEN...';

            // 1. データを一時保存 (まだDBには送らない)
            const pendingData = {
                email: email,
                display_name: name,
                password: pass
            };
            sessionStorage.setItem('pending_node_data', JSON.stringify(pendingData));

            // 2. 固定の認証コードをセット (テスト用: 123456)
            sessionStorage.setItem('active_verify_token', '123456');

            // 3. Verify画面へリダイレクト
            setTimeout(() => {
                window.location.href = `auth/verify.html?email=${encodeURIComponent(email)}`;
            }, 800);
        };
    </script>
</body>
</html>
