<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexloger | identity Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at center, #09090b, #020617); 
            height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .glass {
            background: rgba(24, 24, 27, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 認証待ちのパルスアニメーション */
        .pulse-border {
            animation: pulse-emerald 2s infinite;
        }
        @keyframes pulse-emerald {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .auth-animate { animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-zinc-400 flex items-center justify-center p-6">

    <div class="w-full max-w-md glass p-12 rounded-[2.5rem] space-y-10 shadow-2xl auth-animate text-center">
        
        <div class="space-y-4">
            <div class="relative w-20 h-20 mx-auto mb-8">
                <div class="absolute inset-0 border-2 border-emerald-500 rounded-2xl pulse-border"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span class="text-emerald-500 mono font-bold text-xl animate-pulse">#</span>
                </div>
            </div>
            
            <div class="inline-block px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-full text-[9px] text-emerald-500 mono font-bold uppercase tracking-[0.3em] mb-2">
                Phase_02: Credential_Check
            </div>
            <h2 class="text-white font-black tracking-tighter text-3xl italic uppercase">Verify_Identity</h2>
            <p id="target-email" class="text-[10px] text-zinc-500 uppercase tracking-widest leading-loose mono truncate px-4">
                Waiting for authorization...
            </p>
        </div>

        <div class="space-y-6">
            <div class="group">
                <label class="text-[9px] text-zinc-600 uppercase font-bold mono group-focus-within:text-emerald-500 transition-colors block mb-2">Verification_Token</label>
                <input id="verify-code" type="text" maxlength="6" placeholder="000000" class="w-full bg-black/40 border border-white/5 rounded-2xl p-5 text-2xl text-center tracking-[0.5em] text-white mono outline-none focus:border-emerald-500/40 transition-all">
            </div>

            <button id="verify-submit" class="w-full bg-emerald-600 text-white py-5 rounded-2xl text-[11px] font-black hover:bg-emerald-500 transition-all uppercase tracking-[0.2em] shadow-lg shadow-emerald-900/40 active:scale-[0.98]">
                Finalize_Access
            </button>
        </div>

        <div class="pt-6 border-t border-white/5 flex flex-col gap-4">
            <p class="text-[10px] text-zinc-600 mono uppercase">Did not receive the pulse?</p>
            <button id="resend-btn" class="text-[9px] text-emerald-500 hover:text-emerald-400 font-bold uppercase tracking-widest transition-colors">Resend_Signal</button>
        </div>
        
        <div id="verify-msg" class="text-[9px] text-center text-rose-500 uppercase h-2 font-bold mono"></div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        
        const SUPABASE_URL = 'https://zphmbedascwcoddrserg.supabase.co'
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwaG1iZWRhc2N3Y29kZHJzZXJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNTQ3NTIsImV4cCI6MjA5MjgzMDc1Mn0.MnnGK-V4vRC8Y_ILWlUiLNkMppWDi53S9RBUpKR2amE'
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

        // URLからEmailを取得して表示
        const params = new URLSearchParams(window.location.search);
        const email = params.get('email');
        if (email) document.getElementById('target-email').innerText = email;

        document.getElementById('verify-submit').onclick = async () => {
            const code = document.getElementById('verify-code').value;
            const msg = document.getElementById('verify-msg');

            if (!code) {
                msg.innerText = 'TOKEN_REQUIRED';
                return;
            }

            msg.innerText = 'VERIFYING_CREDENTIALS...';

            // 本来はAuth APIを使うが、既存の nex_users の status を更新する簡易ロジック
            const { data, error } = await supabase
                .from('nex_users')
                .update({ status: 'active' })
                .eq('email', email)
                .select();

            if (!error && data.length > 0) {
                msg.innerText = 'ACCESS_GRANTED';
                setTimeout(() => {
                    window.location.href = '../login.html';
                }, 1500);
            } else {
                msg.innerText = 'VERIFICATION_FAILED: INVALID_TOKEN';
            }
        };
    </script>
</body>
</html>
