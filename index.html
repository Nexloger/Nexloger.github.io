<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexloger | Digital Pulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top right, #09090b, #020617); 
            height: 100vh;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass {
            background: rgba(24, 24, 27, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(63, 63, 70, 0.3);
        }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(161, 161, 170, 0.2); border-radius: 10px; }
        .auth-animate { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="text-zinc-300 flex flex-col overflow-hidden">

    <header class="h-16 border-b border-white/5 flex items-center px-8 justify-between shrink-0 glass z-40">
        <div class="flex items-center gap-6">
            <h1 class="text-white font-black tracking-tighter text-xl italic uppercase group cursor-default">
                NEX<span class="text-emerald-500 group-hover:text-emerald-400 transition-colors">LOGER</span>
            </h1>
            <div id="status" class="mono text-[9px] py-1 px-3 bg-emerald-500/10 border border-emerald-500/20 rounded-full text-emerald-500 uppercase tracking-widest font-bold">
                Online_Pulse
            </div>
        </div>

        <div class="flex items-center gap-8">
            <nav id="auth-nav" class="mono flex gap-6 text-[10px] font-bold uppercase tracking-widest">
                <a href="accounts/login.html" class="text-zinc-400 hover:text-white transition-all">Connect</a>
                <a href="accounts/signup.html" class="text-emerald-500 hover:text-emerald-400 transition-all border border-emerald-500/30 px-3 py-1 rounded">Initialize_ID</a>
            </nav>
            <div id="user-profile" class="hidden flex items-center gap-4">
                <div class="flex flex-col items-end">
                    <span id="user-display" class="text-[10px] font-bold text-zinc-100 uppercase tracking-tighter"></span>
                    <span class="text-[8px] text-zinc-500 mono">AUTHORIZED_USER</span>
                </div>
                <button id="logout-btn" class="text-[9px] text-zinc-500 hover:text-red-400 transition-all uppercase underline decoration-zinc-800">Disconnect</button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <aside class="w-60 border-r border-white/5 overflow-y-auto custom-scroll hidden md:block bg-zinc-950/20">
            <div class="p-6 text-[10px] text-zinc-500 uppercase tracking-[0.3em] font-black opacity-50">Data_Sectors</div>
            <ul id="box-list" class="px-4 space-y-2"></ul>
        </aside>

        <section class="flex-1 flex flex-col min-w-0 bg-zinc-950/10 relative">
            <header class="p-5 border-b border-white/5 flex justify-between items-center bg-white/2">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span id="current-title" class="text-xs text-white font-black uppercase tracking-widest mono">Select_Sector</span>
                </div>
            </header>
            
            <div id="feed" class="flex-1 overflow-y-auto p-8 space-y-6 custom-scroll pb-32">
                </div>

            <button id="open-post-modal" class="absolute bottom-8 right-8 w-14 h-14 bg-emerald-600 text-white rounded-2xl shadow-2xl flex items-center justify-center hover:bg-emerald-500 transition-all active:scale-95 z-50 group">
                <span class="text-2xl group-hover:rotate-90 transition-transform">+</span>
            </button>
        </section>
    </main>

    <div id="post-modal" class="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center p-6 hidden">
        <div class="w-full max-w-xl glass p-8 rounded-[2rem] border border-white/10 space-y-6 auth-animate">
            <div class="flex justify-between items-center">
                <h3 class="text-white font-black italic uppercase tracking-tighter mono text-lg">Create_New_Log</h3>
                <button id="close-post-modal" class="text-zinc-500 hover:text-white mono text-[10px] uppercase font-bold tracking-widest">Close_Esc</button>
            </div>
            
            <div class="space-y-4">
                <div class="bg-black/20 p-4 rounded-xl border border-white/5">
                    <span class="text-[9px] text-emerald-500 mono font-bold block mb-1 uppercase">Target_Sector</span>
                    <span id="modal-sector-name" class="text-xs text-zinc-100 font-bold uppercase tracking-widest">---</span>
                </div>
                
                <textarea id="modal-content" rows="5" 
                    class="w-full bg-black/40 border border-white/5 rounded-2xl p-6 text-zinc-100 text-sm outline-none focus:border-emerald-500/40 transition-all resize-none placeholder-zinc-700"
                    placeholder="システムログを入力してください..."></textarea>

                <div class="space-y-2">
                    <input type="file" id="modal-image-input" accept="image/*" class="hidden">
                    <label for="modal-image-input" class="flex items-center justify-center gap-3 w-full py-4 border border-dashed border-white/10 rounded-2xl text-zinc-500 hover:border-emerald-500/40 hover:text-emerald-500 transition-all cursor-pointer bg-white/2">
                        <span class="text-sm">📷</span>
                        <span id="file-status" class="text-[9px] mono font-bold uppercase tracking-[0.2em]">Attach_Media_Payload</span>
                    </label>
                    <div id="image-preview" class="hidden w-full h-40 rounded-xl overflow-hidden border border-white/10 bg-black/40">
                        <img src="" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>

            <button id="modal-transmit-btn" class="w-full bg-emerald-600 text-white py-5 rounded-2xl text-[11px] font-black hover:bg-emerald-500 transition-all uppercase tracking-[0.3em] shadow-lg shadow-emerald-900/40">
                Transmit_Data_Stream
            </button>
        </div>
    </div>

    <div id="auth-overlay" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-6 hidden auth-animate">
        <div class="w-full max-w-md glass p-12 rounded-3xl border border-white/10 text-center shadow-2xl">
            <div class="mb-10 text-center">
                <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl flex items-center justify-center mx-auto mb-6">
                    <div class="w-8 h-8 border-2 border-emerald-500 rounded-lg"></div>
                </div>
                <h2 class="text-white font-black tracking-tighter text-3xl italic uppercase mb-2">Security_Gate</h2>
                <p class="mono text-[10px] text-zinc-500 uppercase tracking-widest">Authentication required for transmission</p>
            </div>
            <div class="flex flex-col gap-4">
                <a href="accounts/login.html" class="w-full bg-white text-black py-4 rounded-xl text-xs font-black hover:bg-emerald-400 transition-all uppercase tracking-[0.2em]">Connect_Terminal</a>
                <a href="accounts/signup.html" class="w-full border border-white/10 text-zinc-400 py-4 rounded-xl text-[10px] font-black hover:bg-white/5 hover:text-white transition-all uppercase tracking-[0.2em]">Create_Access_Key</a>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
