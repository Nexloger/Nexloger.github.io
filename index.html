<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexloger | Digital Pulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background-color: #050505; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #18181b; }
        
        /* ログイン画面のフェードイン用 */
        .auth-animate { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="text-zinc-400 h-screen flex flex-col overflow-hidden">

    <header class="h-14 border-b border-zinc-900 flex items-center px-6 justify-between shrink-0 bg-[#050505]/80 backdrop-blur-sm z-40">
        <div class="flex items-center gap-4">
            <h1 class="text-white font-bold tracking-tighter text-lg">NEXLOGER</h1>
            <div id="status" class="text-[9px] py-0.5 px-2 border border-zinc-800 rounded text-zinc-600 uppercase tracking-widest">
                Standby
            </div>
        </div>

        <div class="flex items-center gap-6">
            <nav id="auth-nav" class="flex gap-4 text-[10px] font-bold uppercase tracking-widest">
                <a href="login.html" class="text-zinc-500 hover:text-white transition">Login</a>
                <a href="signup.html" class="text-zinc-500 hover:text-white transition border-l border-zinc-800 pl-4">Signup</a>
            </nav>
            <div id="user-profile" class="hidden flex items-center gap-3">
                <span id="user-display" class="text-[10px] font-bold text-zinc-500 uppercase"></span>
                <button id="logout-btn" class="text-[9px] text-zinc-700 hover:text-red-900 transition uppercase underline decoration-zinc-800">Logout</button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <aside class="w-48 border-r border-zinc-900 overflow-y-auto custom-scroll hidden md:block bg-[#080808]">
            <div class="p-4 text-[10px] text-zinc-600 uppercase tracking-[0.2em] font-bold">Active_Boxes</div>
            <ul id="box-list" class="px-2 space-y-1">
                </ul>
        </aside>

        <section class="flex-1 flex flex-col min-w-0 bg-[#070707]">
            <header class="p-4 border-b border-zinc-900/50 flex justify-between items-center">
                <span id="current-title" class="text-xs text-zinc-200 font-bold uppercase tracking-widest">Select a Box</span>
            </header>
            
            <div id="feed" class="flex-1 overflow-y-auto p-6 space-y-4 custom-scroll">
                </div>

            <footer class="p-4 border-t border-zinc-900 bg-[#050505]">
                <div class="max-w-3xl mx-auto flex gap-3">
                    <textarea 
                        id="message-input" 
                        rows="1" 
                        class="flex-1 bg-zinc-900/40 border border-zinc-800 rounded px-4 py-2.5 text-sm text-zinc-200 focus:outline-none focus:border-zinc-500 transition-all resize-none"
                        placeholder="Push your log..."
                    ></textarea>
                    <button id="send-btn" class="bg-zinc-200 text-black px-5 py-1 text-xs font-black hover:bg-white transition uppercase tracking-tighter shadow-lg shadow-white/5">Push</button>
                </div>
            </footer>
        </section>
    </main>

    <div id="auth-overlay" class="fixed inset-0 z-50 bg-[#050505] flex items-center justify-center p-6 hidden auth-animate">
        <div class="w-full max-w-sm border border-zinc-900 bg-[#080808] p-10 space-y-8 relative text-center">
            <div class="space-y-2">
                <h2 class="text-white font-bold tracking-tighter text-2xl italic uppercase">Access_Required</h2>
                <div class="h-px w-12 bg-zinc-800 mx-auto"></div>
                <p class="text-[9px] text-zinc-600 uppercase tracking-widest leading-loose">Credential verification needed to access terminal</p>
            </div>

            <div class="flex flex-col gap-4">
                <a href="login.html" class="w-full bg-zinc-200 text-black py-4 text-[10px] font-black hover:bg-white transition-all uppercase tracking-[0.2em]">Go_to_Login</a>
                <a href="signup.html" class="w-full border border-zinc-800 text-zinc-500 py-4 text-[10px] font-black hover:bg-zinc-900 hover:text-white transition-all uppercase tracking-[0.2em]">Register_New_ID</a>
            </div>

            <div class="pt-4 border-t border-zinc-900/50">
                <p class="text-[8px] text-zinc-800 uppercase tracking-tighter italic">NEX_CORE_SECURITY_PROTOCOL_v4.2</p>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
